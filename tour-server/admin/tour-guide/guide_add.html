<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin - Thêm hướng dẫn viên</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="../container/js/tailwind.config.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        h1,
        h2,
        h3 {
            font-family: 'Manrope', sans-serif;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
        }
    </style>
</head>

<body class="bg-surface text-on-surface">
    <!-- Component Containers -->
    <div id="sidebar-container"></div>

    <!-- Main Content Wrapper -->
    <main class="ml-72 min-h-screen flex flex-col">
        <div id="topbar-container"></div>

        <!-- Content Area -->
        <div class="p-10 max-w-6xl mx-auto w-full space-y-8">
            <!-- Page Title -->
            <div class="mb-8">
                <h2 class="text-3xl font-extrabold font-headline tracking-tight text-on-surface">Thêm Hướng Dẫn Viên Mới
                </h2>
                <p class="text-on-surface-variant mt-1 font-body">Cung cấp thông tin chi tiết để tạo hồ sơ nhân sự mới
                    trong hệ thống.</p>
            </div>

            <form id="guide-form" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <!-- Left Column (Smaller) -->
                <div class="lg:col-span-4 space-y-8">
                    <!-- Avatar Section -->
                    <section class="bg-surface-container-lowest p-8 rounded-lg shadow-sm flex flex-col items-center">
                        <div class="relative">
                            <div
                                class="w-48 h-48 rounded-full bg-surface-container overflow-hidden border-4 border-white shadow-lg flex items-center justify-center">
                                <span class="material-symbols-outlined text-outline text-6xl">person</span>
                                <img id="preview-avatar" alt="Avatar Preview"
                                    class="absolute inset-0 w-full h-full object-cover hidden" src="" />
                            </div>
                            <label for="avatar-input"
                                class="absolute bottom-2 right-2 bg-primary text-white p-3 rounded-full shadow-xl hover:scale-110 active:scale-95 transition-all cursor-pointer border-4 border-white">
                                <span class="material-symbols-outlined text-xl">photo_camera</span>
                                <input type="file" id="avatar-input" class="hidden" accept="image/*"
                                    onchange="previewImage(this)">
                            </label>
                        </div>
                        <p class="mt-6 text-[12px] text-center text-on-surface-variant font-medium uppercase tracking-wider">Ảnh hồ sơ hướng dẫn viên</p>
                    </section>

                    <!-- Contact Info Section -->
                    <section class="bg-surface-container-lowest p-8 rounded-lg shadow-sm space-y-6">
                        <h3 class="text-sm font-bold font-headline text-on-surface uppercase tracking-wider">Liên lạc</h3>
                        <div class="space-y-6">
                            <!-- Floating Label Email -->
                            <div class="relative group">
                                <input type="email" id="email" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="email"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Email</label>
                                <span class="material-symbols-outlined absolute right-3 top-4 text-outline-variant text-lg group-focus-within:text-primary transition-colors">mail</span>
                            </div>

                            <!-- Floating Label Phone -->
                            <div class="relative group">
                                <input type="tel" id="phone" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="phone"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Số điện thoại</label>
                                <span class="material-symbols-outlined absolute right-3 top-4 text-outline-variant text-lg group-focus-within:text-primary transition-colors">call</span>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Right Column (Larger) -->
                <div class="lg:col-span-8 space-y-8">
                    <!-- Basic Info Section -->
                    <section class="bg-surface-container-lowest p-8 rounded-lg shadow-sm space-y-8">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-8 h-8 rounded bg-primary-fixed flex items-center justify-center text-primary">
                                <span class="material-symbols-outlined text-sm">badge</span>
                            </div>
                            <h3 class="text-lg font-bold font-headline text-on-surface">Thông tin cơ bản</h3>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Floating Label Name -->
                            <div class="md:col-span-1 relative">
                                <input type="text" id="full_name" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="full_name"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Tên hướng dẫn viên</label>
                            </div>

                            <!-- Floating Label DOB -->
                            <div class="md:col-span-1 relative">
                                <input type="date" id="dob" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="dob"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Ngày sinh</label>
                            </div>

                            <!-- Floating Label Address -->
                            <div class="md:col-span-2 relative">
                                <input type="text" id="add" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="add"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Địa chỉ</label>
                            </div>

                            <!-- Floating Label Bio -->
                            <div class="md:col-span-2 relative">
                                <textarea id="bio" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all resize-none min-h-[120px]"></textarea>
                                <label for="bio"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Tiểu sử kinh nghiệm</label>
                            </div>
                        </div>
                    </section>

                    <!-- Account Security Section -->
                    <section class="bg-surface-container-lowest p-8 rounded-lg shadow-sm space-y-8">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-8 h-8 rounded bg-error-container flex items-center justify-center text-error">
                                <span class="material-symbols-outlined text-sm">lock</span>
                            </div>
                            <h3 class="text-lg font-bold font-headline text-on-surface">Bảo mật tài khoản</h3>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Password with Visibility Toggle -->
                            <div class="relative">
                                <input type="password" id="password" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 pr-12 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="password"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Mật khẩu</label>
                                <button type="button" onclick="togglePassword('password')"
                                    class="absolute right-3 top-4 text-outline-variant hover:text-primary transition-colors">
                                    <span class="material-symbols-outlined text-lg" id="eye-icon-password">visibility</span>
                                </button>
                            </div>

                            <!-- Confirm Password with Visibility Toggle -->
                            <div class="relative">
                                <input type="password" id="confirm_password" placeholder=" "
                                    class="peer w-full px-4 pt-6 pb-2 pr-12 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all">
                                <label for="confirm_password"
                                    class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs">Xác nhận mật khẩu</label>
                                <button type="button" onclick="togglePassword('confirm_password')"
                                    class="absolute right-3 top-4 text-outline-variant hover:text-primary transition-colors">
                                    <span class="material-symbols-outlined text-lg" id="eye-icon-confirm_password">visibility</span>
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Action Buttons -->
                    <div class="flex justify-end items-center gap-4 mt-12 pt-4 border-t border-outline-variant/20">
                        <button onclick="window.location.href='guide.html'"
                            class="px-8 py-3 bg-surface-container-high text-primary font-bold rounded-lg hover:bg-surface-container-highest transition-all active:scale-95"
                            type="button">Hủy</button>
                        <button
                            class="px-10 py-3 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-lg shadow-lg shadow-primary/20 hover:shadow-xl active:scale-95 transition-all"
                            type="submit">Lưu thông tin</button>
                    </div>
                </div>
            </form>
        </div>
        <!-- Footer Spacer -->
        <div class="h-16"></div>
    </main>

    <!-- Scripts -->
    <script src="../container/js/sidebar.js"></script>
    <script src="../container/js/topbar.js"></script>
    <script src="../container/js/guide.js"></script>
    <script>
        function previewImage(input) {
            const preview = document.getElementById('preview-avatar');
            const icon = preview.previousElementSibling;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    icon.classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById(`eye-icon-${id}`);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body>

</html>
